{% if current_user %}
<style>
  .ask-topai-root {
    position: fixed !important;
    right: max(16px, env(safe-area-inset-right, 0px));
    bottom: max(16px, env(safe-area-inset-bottom, 0px));
    left: auto;
    top: auto;
    z-index: 10050;
    font-family: inherit;
    width: auto;
    max-width: calc(100vw - 24px);
    margin: 0;
    padding: 0;
    pointer-events: none;
    transform: none;
    filter: none;
  }
  .ask-topai-fab,
  .ask-topai-panel { pointer-events: auto; }
  .ask-topai-fab {
    display: inline-flex !important;
    align-items: center;
    gap: 8px;
    background: #1a1a2e;
    color: #fff !important;
    border: 0;
    border-radius: 999px;
    padding: 12px 16px !important;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.2;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(15,23,42,0.28);
    width: auto !important;
    max-width: 100%;
    white-space: nowrap;
  }
  .ask-topai-fab-icon { font-size: 16px; line-height: 1; }
  .ask-topai-fab:hover { background: #232344; }
  .ask-topai-fab:focus-visible { outline: 2px solid #4f8ef7; outline-offset: 3px; }
  .ask-topai-panel {
    display: none;
    position: absolute;
    right: 0;
    bottom: 56px;
    width: min(400px, calc(100vw - 24px));
    background: #fff;
    color: #1a1a2e;
    border-radius: 14px;
    box-shadow: 0 16px 40px rgba(15,23,42,0.28);
    border: 1px solid #e5ebf5;
    overflow: hidden;
  }
  .ask-topai-root.is-open .ask-topai-panel { display: block; }
  .ask-topai-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: #1a1a2e; color: #fff; }
  .ask-topai-head strong { font-size: 14px; }
  .ask-topai-close { background: transparent; border: 0; color: #fff; font-size: 18px; cursor: pointer; }
  .ask-topai-body { padding: 12px 14px 14px; }
  .ask-topai-status { font-size: 12px; color: #667; margin: 0 0 8px; }
  .ask-topai-status.listening { color: #15803d; font-weight: 700; }
  .ask-topai-status.speaking { color: #1d4ed8; font-weight: 700; }
  .ask-topai-status.working { color: #a16207; font-weight: 700; }
  .ask-topai-status.reconnecting { color: #b45309; font-weight: 700; }
  .ask-topai-status.clarify { color: #1a1a2e; font-weight: 600; }
  .ask-topai-log {
    max-height: 220px;
    overflow-y: auto;
    background: #f8fafc;
    border: 1px solid #eef2f7;
    border-radius: 10px;
    padding: 8px 10px;
    margin: 0 0 10px;
    font-size: 13px;
  }
  .ask-topai-turn { margin: 0 0 8px; }
  .ask-topai-turn strong { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: #667; }
  .ask-topai-turn p { margin: 2px 0 0; white-space: pre-wrap; }
  .ask-topai-choices { margin: 8px 0 0; padding-left: 18px; font-size: 13px; }
  .ask-topai-transcript {
    width: 100%; min-height: 72px; resize: vertical; border: 1.5px solid #dde3f0; border-radius: 8px;
    padding: 8px; font: inherit; font-size: 14px;
  }
  .ask-topai-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .ask-topai-actions button, .ask-topai-preview button {
    border: 0; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .ask-topai-primary { background: #1a1a2e; color: #fff; }
  .ask-topai-primary:disabled { opacity: 0.65; cursor: wait; }
  .ask-topai-secondary { background: #eef2f7; color: #334; }
  .ask-topai-danger { background: #b91c1c; color: #fff; }
  .ask-topai-live-end { display: none; }
  .ask-topai-root.is-live .ask-topai-live-end { display: inline-flex; }
  .ask-topai-root.is-live .ask-topai-live-start { display: none; }
  .ask-topai-preview { margin-top: 12px; background: #f8fafc; border: 1px solid #eef2f7; border-radius: 10px; padding: 10px; }
  .ask-topai-preview h3 { margin: 0 0 8px; font-size: 13px; }
  .ask-topai-result { margin-top: 10px; font-size: 14px; font-weight: 700; color: #15803d; }
  .ask-topai-result.is-warn { color: #9a3412; }
  .ask-topai-error { margin-top: 10px; font-size: 13px; color: #b91c1c; }
  @media (max-width: 640px) {
    .ask-topai-root {
      right: max(10px, env(safe-area-inset-right, 0px));
      bottom: max(10px, env(safe-area-inset-bottom, 0px));
    }
    .ask-topai-panel { width: calc(100vw - 20px); }
  }
</style>
<div class="ask-topai-root" id="ask-topai-root">
  <div class="ask-topai-panel" id="ask-topai-panel" role="dialog" aria-labelledby="ask-topai-title" hidden>
    <div class="ask-topai-head">
      <strong id="ask-topai-title">Ask TopAI</strong>
      <button type="button" class="ask-topai-close" id="ask-topai-close" aria-label="Close Ask TopAI">&times;</button>
    </div>
    <div class="ask-topai-body">
      <p class="ask-topai-status" id="ask-topai-status">Start a live conversation or type a request.</p>
      <div class="ask-topai-log" id="ask-topai-log" hidden></div>
      <div id="ask-topai-choices" hidden></div>
      <label class="muted" for="ask-topai-text" style="font-size:12px;">Type a message</label>
      <textarea id="ask-topai-text" class="ask-topai-transcript" placeholder="Create a buyer lead named John Smith at 303-555-1212..."></textarea>
      <div class="ask-topai-actions">
        <button type="button" class="ask-topai-primary ask-topai-live-start" id="ask-topai-live-start">Start Live Conversation</button>
        <button type="button" class="ask-topai-danger ask-topai-live-end" id="ask-topai-live-end">End Conversation</button>
        <button type="button" class="ask-topai-primary" id="ask-topai-submit">Send</button>
        <button type="button" class="ask-topai-secondary" id="ask-topai-clear">Clear</button>
      </div>
      <div class="ask-topai-preview" id="ask-topai-preview" hidden></div>
      <div class="ask-topai-result" id="ask-topai-result" hidden></div>
      <div class="ask-topai-error" id="ask-topai-error" hidden></div>
    </div>
  </div>
  <button type="button" class="ask-topai-fab" id="ask-topai-fab" aria-expanded="false" aria-controls="ask-topai-panel">
    <span class="ask-topai-fab-icon" aria-hidden="true">🎙</span>
    <span class="ask-topai-fab-label">Ask TopAI</span>
  </button>
</div>
<script>
(function initAskTopAI() {
  if (window.__askTopAIInit) return;
  const root = document.getElementById('ask-topai-root');
  if (!root) return;
  window.__askTopAIInit = true;
  if (root.parentNode !== document.body) {
    document.body.appendChild(root);
  }
  const panel = document.getElementById('ask-topai-panel');
  const fab = document.getElementById('ask-topai-fab');
  const titleEl = document.getElementById('ask-topai-title');
  const statusEl = document.getElementById('ask-topai-status');
  const textEl = document.getElementById('ask-topai-text');
  const logEl = document.getElementById('ask-topai-log');
  const previewEl = document.getElementById('ask-topai-preview');
  const resultEl = document.getElementById('ask-topai-result');
  const errorEl = document.getElementById('ask-topai-error');
  const choicesEl = document.getElementById('ask-topai-choices');
  const submitBtn = document.getElementById('ask-topai-submit');
  const startBtn = document.getElementById('ask-topai-live-start');
  const endBtn = document.getElementById('ask-topai-live-end');
  let sending = false;
  let lastInputSource = 'text';
  const live = {
    active: false,
    ending: false,
    reconnecting: false,
    reconnectTimer: null,
    reconnectAttempts: 0,
    sessionId: null,
    pc: null,
    dc: null,
    stream: null,
    audio: null,
    webrtcUrl: '/api/ask-topai/live/webrtc',
    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],
    pendingCalls: [],
    flushing: false,
    turns: [],
    assistantBuf: '',
    assistantEl: null,
    userEl: null,
    stage: null,
    lastRef: null
  };
  window.__askTopAILive = live;

  function sessionId() {
    try {
      let id = sessionStorage.getItem('askTopAISession');
      if (!id) {
        id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('sess-' + Date.now());
        sessionStorage.setItem('askTopAISession', id);
      }
      return id;
    } catch (err) {
      return 'sess-local';
    }
  }

  function rememberSession(id) {
    if (!id) return;
    try { sessionStorage.setItem('askTopAISession', id); } catch (err) {}
  }

  function resetSession() {
    try { sessionStorage.removeItem('askTopAISession'); } catch (err) {}
  }

  function askContext() {
    const page = window.location.pathname || '';
    const match = page.match(/\/crm\/leads\/(\d+)/);
    let leadId = match ? Number(match[1]) : null;
    const smsSelect = document.getElementById('sms-lead-select');
    if (!leadId && smsSelect && smsSelect.value) leadId = Number(smsSelect.value);
    let leadName = null;
    const heading = document.querySelector('h1, .lead-name, [data-lead-name]');
    if (leadId && heading) leadName = (heading.getAttribute('data-lead-name') || heading.textContent || '').trim().slice(0, 120);
    return { page, lead_id: leadId, lead_name: leadName };
  }

  function setOpen(open) {
    root.classList.toggle('is-open', open);
    panel.hidden = !open;
    fab.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) setTimeout(() => textEl.focus(), 30);
    else if (live.active) endLive(true);
  }

  function setError(msg) {
    errorEl.hidden = !msg;
    errorEl.textContent = msg || '';
  }

  function setResult(msg, kind) {
    resultEl.hidden = !msg;
    resultEl.textContent = msg ? ((kind === 'warn' ? '' : '✓ ') + msg) : '';
    resultEl.classList.toggle('is-warn', kind === 'warn');
  }

  function resetPreview() {
    previewEl.hidden = true;
    previewEl.innerHTML = '';
  }

  function setSending(on) {
    sending = !!on;
    if (submitBtn) {
      submitBtn.disabled = sending;
      submitBtn.textContent = sending ? 'Working…' : 'Send';
    }
  }

  function setConn(label, kind) {
    statusEl.textContent = label;
    statusEl.classList.remove('listening', 'speaking', 'working', 'reconnecting', 'clarify');
    if (kind) statusEl.classList.add(kind);
  }

  function looksLikeSdp(text) {
    return String(text || '').replace(/^\uFEFF/, '').trimStart().indexOf('v=0') === 0;
  }

  function looksLikeHtml(text) {
    const head = String(text || '').trimStart().slice(0, 400).toLowerCase();
    return head.indexOf('<!doctype') === 0 || head.indexOf('<html') === 0 || head.indexOf('<html') !== -1;
  }

  function liveError(stage, message, extra) {
    extra = extra || {};
    const err = new Error(message || 'TopAI could not establish the Realtime session.');
    err.stage = stage;
    err.code = extra.code;
    err.status = extra.status;
    err.ref = extra.ref || live.lastRef;
    err.userMessage = extra.userMessage || message;
    return err;
  }

  function formatLiveError(err) {
    let message = (err && (err.userMessage || err.message)) || 'TopAI could not establish the Realtime session.';
    const ref = err && err.ref;
    if (ref) message += ' (ref ' + ref + ')';
    return message;
  }

  function logLive(reason, extra) {
    const payload = {
      stage: live.stage,
      ref: live.lastRef,
      connection: live.pc && live.pc.connectionState,
      ice: live.pc && live.pc.iceConnectionState,
      signaling: live.pc && live.pc.signalingState,
      dc: live.dc && live.dc.readyState
    };
    if (extra) Object.keys(extra).forEach((key) => { payload[key] = extra[key]; });
    console.info('Ask TopAI live', reason, payload);
  }

  function waitForIce(pc, timeoutMs) {
    if (!pc || pc.iceGatheringState === 'complete') return Promise.resolve();
    return new Promise((resolve) => {
      const finish = () => {
        try { pc.removeEventListener('icegatheringstatechange', onChange); } catch (err) {}
        resolve();
      };
      const onChange = () => {
        if (pc.iceGatheringState === 'complete') finish();
      };
      pc.addEventListener('icegatheringstatechange', onChange);
      setTimeout(finish, timeoutMs || 3000);
    });
  }

  function setLiveMode(on) {
    live.active = !!on;
    root.classList.toggle('is-live', live.active);
    titleEl.textContent = live.active ? 'Ask TopAI — Live' : 'Ask TopAI';
    logEl.hidden = !live.active && live.turns.length === 0;
    if (startBtn) startBtn.disabled = !!on;
    if (endBtn) endBtn.disabled = !on;
  }

  function escapeAsk(value) {
    return String(value || '').replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  function renderChoices(choices) {
    if (!choicesEl) return;
    if (!choices || !choices.length) {
      choicesEl.hidden = true;
      choicesEl.innerHTML = '';
      return;
    }
    const items = choices.map((choice) => {
      const label = choice.label || choice.name || ('Lead #' + (choice.id || ''));
      const phone = choice.phone_number || choice.phone || '';
      return `<li>${escapeAsk(label)}${phone ? ' — ' + escapeAsk(phone) : ''}</li>`;
    }).join('');
    choicesEl.innerHTML = `<ol class="ask-topai-choices">${items}</ol>`;
    choicesEl.hidden = false;
  }

  function appendTurn(role, text, streaming) {
    logEl.hidden = false;
    const label = role === 'user' ? 'You' : 'Ask TopAI';
    if (streaming && role === 'assistant' && live.assistantEl) {
      live.assistantEl.querySelector('p').textContent = text;
      logEl.scrollTop = logEl.scrollHeight;
      return;
    }
    const wrap = document.createElement('div');
    wrap.className = 'ask-topai-turn ' + (role === 'user' ? 'you' : 'assistant');
    wrap.innerHTML = `<strong>${label}</strong><p></p>`;
    wrap.querySelector('p').textContent = text || '';
    logEl.appendChild(wrap);
    logEl.scrollTop = logEl.scrollHeight;
    if (role === 'assistant' && streaming) live.assistantEl = wrap;
    if (role === 'user') live.userEl = wrap;
    return wrap;
  }

  function rememberTurn(role, text) {
    const cleaned = String(text || '').trim();
    if (!cleaned) return;
    const last = live.turns[live.turns.length - 1];
    if (last && last.role === role) last.text = cleaned;
    else live.turns.push({ role, text: cleaned });
  }

  function lastUserText() {
    for (let i = live.turns.length - 1; i >= 0; i--) {
      if (live.turns[i].role === 'user') return live.turns[i].text;
    }
    return textEl.value.trim();
  }

  function refreshAffectedUI(refresh) {
    if (!refresh) return;
    const path = window.location.pathname || '';
    const leadMatch = path.match(/\/crm\/leads\/(\d+)/);
    const leadIds = refresh.lead_ids || [];
    if (refresh.tasks && path.indexOf('/crm/tasks') === 0) {
      window.location.reload();
      return;
    }
    if (refresh.leads && path.indexOf('/crm/leads') === 0 && !leadMatch) {
      window.location.reload();
      return;
    }
    if (leadMatch && leadIds.map(String).indexOf(leadMatch[1]) !== -1) {
      window.location.reload();
    }
  }

  function sendEvent(event) {
    if (live.dc && live.dc.readyState === 'open') {
      live.dc.send(JSON.stringify(event));
    }
  }

  function bargeIn() {
    if (live.audio) live.audio.muted = true;
    live.assistantBuf = '';
    live.assistantEl = null;
    sendEvent({ type: 'response.cancel' });
    setConn('Listening', 'listening');
  }

  function teardownPeer() {
    try { if (live.dc) live.dc.close(); } catch (err) {}
    live.dc = null;
    if (live.pc) {
      try { live.pc.getSenders().forEach((sender) => { try { live.pc.removeTrack(sender); } catch (err) {} }); } catch (err) {}
      try { live.pc.close(); } catch (err) {}
    }
    live.pc = null;
    if (live.audio) {
      try { live.audio.pause(); } catch (err) {}
      live.audio.srcObject = null;
      live.audio = null;
    }
  }

  function stopMicTracks() {
    if (!live.stream) return;
    live.stream.getTracks().forEach((track) => { try { track.stop(); } catch (err) {} });
    live.stream = null;
  }

  async function endLive(notify) {
    live.ending = true;
    live.active = false;
    if (live.reconnectTimer) {
      clearTimeout(live.reconnectTimer);
      live.reconnectTimer = null;
    }
    const sid = live.sessionId;
    const turns = live.turns.slice();
    teardownPeer();
    stopMicTracks();
    setLiveMode(false);
    setConn('Start a live conversation or type a request.');
    if (notify && sid) {
      try {
        await fetch('/api/ask-topai/live/end', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sid, transcript: turns })
        });
      } catch (err) {}
    }
    live.sessionId = null;
    live.pendingCalls = [];
    live.flushing = false;
    live.ending = false;
    live.reconnecting = false;
    live.reconnectAttempts = 0;
  }

  async function mintSession() {
    live.stage = 'backend_session';
    const res = await fetch('/api/ask-topai/live/session', {
      method: 'POST',
      credentials: 'same-origin',
      redirect: 'manual',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session_id: live.sessionId,
        context: askContext()
      })
    });
    if (res.type === 'opaqueredirect' || (res.status >= 300 && res.status < 400)) {
      throw liveError('redirect', 'TopAI could not establish the Realtime session.', { status: res.status, code: 'redirect' });
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) {
      throw liveError('backend_session', data.error || 'Ask TopAI could not start a live conversation.', {
        status: res.status,
        code: data.code,
        ref: data.ref
      });
    }
    if (data.session_id) {
      live.sessionId = data.session_id;
      rememberSession(data.session_id);
    }
    live.webrtcUrl = data.webrtc_url || live.webrtcUrl;
    live.iceServers = data.ice_servers || live.iceServers;
    return data;
  }

  async function readWebrtcAnswer(sdpResponse) {
    const contentType = String(sdpResponse.headers.get('content-type') || '').toLowerCase();
    const headerRef = sdpResponse.headers.get('x-ask-topai-ref') || '';
    const sessionHeader = sdpResponse.headers.get('x-ask-topai-session-id') || '';
    if (sdpResponse.type === 'opaqueredirect' || (sdpResponse.status >= 300 && sdpResponse.status < 400)) {
      throw liveError('redirect', 'TopAI could not establish the Realtime session.', {
        status: sdpResponse.status,
        code: 'redirect',
        ref: headerRef
      });
    }
    const text = await sdpResponse.text();
    let data = {};
    if (contentType.indexOf('application/json') !== -1 || looksLikeHtml(text) || (text && text.trim().charAt(0) === '{')) {
      try { data = JSON.parse(text); } catch (err) { data = {}; }
    }
    const ref = data.ref || headerRef || live.lastRef;
    live.lastRef = ref;
    if (sdpResponse.status === 401) {
      throw liveError('auth', 'Please log in to continue.', { status: 401, code: 'login', ref: ref });
    }
    if (!sdpResponse.ok) {
      throw liveError(data.stage || 'backend_webrtc', data.error || 'TopAI could not establish the Realtime session.', {
        status: sdpResponse.status,
        code: data.code,
        ref: ref,
        userMessage: data.error
      });
    }
    if (contentType.indexOf('text/html') !== -1 || looksLikeHtml(text) || !looksLikeSdp(text)) {
      throw liveError('invalid_sdp', 'TopAI could not establish the Realtime session.', {
        status: sdpResponse.status,
        code: 'invalid_sdp',
        ref: ref
      });
    }
    if (sessionHeader) {
      live.sessionId = sessionHeader;
      rememberSession(sessionHeader);
    }
    return { sdp: text, ref: ref };
  }

  async function attachPeer() {
    live.stage = 'pc_create';
    teardownPeer();
    live.pc = new RTCPeerConnection({ iceServers: live.iceServers });
    live.audio = document.createElement('audio');
    live.audio.autoplay = true;
    live.audio.setAttribute('playsinline', '');
    live.pc.ontrack = (event) => {
      live.stage = 'remote_track';
      logLive('remote-track');
      live.audio.srcObject = event.streams[0];
      live.audio.muted = false;
      live.audio.play().catch(() => {});
    };
    live.stage = 'local_track';
    if (live.stream) {
      live.stream.getTracks().forEach((track) => live.pc.addTrack(track, live.stream));
    }
    live.dc = live.pc.createDataChannel('oai-events');
    live.dc.addEventListener('open', () => {
      live.reconnectAttempts = 0;
      live.reconnecting = false;
      logLive('datachannel-open');
      setConn('Listening', 'listening');
      if (live.pendingCalls.length) flushTools();
    });
    live.dc.addEventListener('error', () => logLive('datachannel-error'));
    live.dc.addEventListener('close', () => logLive('datachannel-close'));
    live.dc.addEventListener('message', onRealtimeMessage);
    live.pc.onconnectionstatechange = () => {
      logLive('connectionstatechange');
      if (live.ending || !live.active) return;
      const state = live.pc && live.pc.connectionState;
      if (state === 'disconnected' || state === 'failed') scheduleReconnect();
    };
    live.pc.oniceconnectionstatechange = () => logLive('iceconnectionstatechange');
    live.pc.onsignalingstatechange = () => logLive('signalingstatechange');
    live.stage = 'offer';
    const offer = await live.pc.createOffer();
    live.stage = 'set_local';
    await live.pc.setLocalDescription(offer);
    live.stage = 'ice_gather';
    await waitForIce(live.pc, 3000);
    const localSdp = (live.pc.localDescription && live.pc.localDescription.sdp) || offer.sdp;
    if (!looksLikeSdp(localSdp)) {
      throw liveError('offer', 'TopAI could not establish the Realtime session.', { code: 'invalid_offer' });
    }
    live.stage = 'backend_webrtc';
    logLive('post-sdp');
    const context = askContext();
    const sdpResponse = await fetch(live.webrtcUrl, {
      method: 'POST',
      credentials: 'same-origin',
      redirect: 'manual',
      body: localSdp,
      headers: {
        'Content-Type': 'application/sdp',
        'X-Ask-TopAI-Session': live.sessionId || '',
        'X-Ask-TopAI-Page': context.page || '',
        'X-Ask-TopAI-Lead-Id': context.lead_id ? String(context.lead_id) : ''
      }
    });
    const answer = await readWebrtcAnswer(sdpResponse);
    live.stage = 'set_remote';
    if (!looksLikeSdp(answer.sdp)) {
      throw liveError('invalid_sdp', 'TopAI could not establish the Realtime session.', { ref: answer.ref, code: 'invalid_sdp' });
    }
    await live.pc.setRemoteDescription({ type: 'answer', sdp: answer.sdp });
    live.stage = 'ice_connect';
    logLive('remote-description-set');
  }

  function scheduleReconnect() {
    if (live.ending || live.reconnecting || !live.active) return;
    if (live.reconnectAttempts >= 3) {
      setError('The live connection dropped. You can start again or type a request.');
      setConn('Reconnecting...', 'reconnecting');
      endLive(true);
      return;
    }
    live.reconnecting = true;
    live.reconnectAttempts += 1;
    setConn('Reconnecting...', 'reconnecting');
    const wait = Math.min(4000, 800 * live.reconnectAttempts);
    live.reconnectTimer = setTimeout(() => {
      connectLive(true).catch(() => {
        live.reconnecting = false;
        scheduleReconnect();
      });
    }, wait);
  }

  function onRealtimeMessage(event) {
    let payload;
    try { payload = JSON.parse(event.data); } catch (err) { return; }
    const type = payload.type || '';
    if (type === 'input_audio_buffer.speech_started') {
      bargeIn();
    } else if (type === 'output_audio_buffer.started' || type === 'response.output_audio.started') {
      if (live.audio) live.audio.muted = false;
      setConn('TopAI is speaking', 'speaking');
    } else if (type === 'response.output_audio_transcript.delta' || type === 'response.audio_transcript.delta') {
      live.assistantBuf += payload.delta || '';
      appendTurn('assistant', live.assistantBuf, true);
      if (live.audio) live.audio.muted = false;
      setConn('TopAI is speaking', 'speaking');
    } else if (type === 'response.output_audio_transcript.done' || type === 'response.audio_transcript.done') {
      const text = payload.transcript || live.assistantBuf;
      live.assistantBuf = '';
      live.assistantEl = null;
      if (text) {
        appendTurn('assistant', text, false);
        rememberTurn('assistant', text);
      }
    } else if (type === 'conversation.item.input_audio_transcription.completed') {
      const text = payload.transcript || '';
      if (text) {
        appendTurn('user', text, false);
        rememberTurn('user', text);
      }
    } else if (type === 'response.function_call_arguments.done') {
      live.pendingCalls.push({
        call_id: payload.call_id,
        name: payload.name,
        arguments: payload.arguments,
        response_id: payload.response_id
      });
      setConn('Working...', 'working');
    } else if (type === 'response.output_item.done' && payload.item && payload.item.type === 'function_call') {
      const item = payload.item;
      if (item.call_id && item.name && !live.pendingCalls.some((c) => c.call_id === item.call_id)) {
        live.pendingCalls.push({
          call_id: item.call_id,
          name: item.name,
          arguments: item.arguments,
          response_id: payload.response_id
        });
        setConn('Working...', 'working');
      }
    } else if (type === 'response.done') {
      const status = (payload.response && payload.response.status) || '';
      const rid = payload.response && payload.response.id;
      if (status === 'cancelled' || status === 'incomplete') {
        live.pendingCalls = live.pendingCalls.filter((call) => call.response_id && call.response_id !== rid);
        setConn('Listening', 'listening');
        return;
      }
      flushTools();
    } else if (type === 'response.cancelled' || type === 'output_audio_buffer.cleared') {
      if (live.audio) live.audio.muted = true;
      setConn('Listening', 'listening');
    } else if (type === 'error') {
      const msg = (payload.error && (payload.error.message || payload.error.code)) || 'Live conversation error.';
      setError(String(msg).slice(0, 220));
    }
  }

  async function flushTools() {
    if (live.flushing) return;
    if (!live.pendingCalls.length) {
      if (live.active && !live.reconnecting) setConn('Listening', 'listening');
      return;
    }
    live.flushing = true;
    const calls = live.pendingCalls.splice(0, live.pendingCalls.length);
    setConn('Working...', 'working');
    let results = [];
    try {
      const res = await fetch('/api/ask-topai/live/tools', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: live.sessionId,
          calls: calls,
          context: askContext(),
          transcript: lastUserText()
        })
      });
      const data = await res.json().catch(() => ({}));
      results = data.results || [];
      refreshAffectedUI(data.refresh);
    } catch (err) {
      results = calls.map((call) => ({
        call_id: call.call_id,
        output: {
          ok: false,
          status: 'error',
          message: 'The CRM update failed. Tell the agent you could not complete it, and do not claim success.'
        }
      }));
    }
    results.forEach((item) => {
      sendEvent({
        type: 'conversation.item.create',
        item: {
          type: 'function_call_output',
          call_id: item.call_id,
          output: JSON.stringify(item.output || {})
        }
      });
    });
    calls.forEach((call) => {
      if (!results.some((item) => item.call_id === call.call_id)) {
        sendEvent({
          type: 'conversation.item.create',
          item: {
            type: 'function_call_output',
            call_id: call.call_id,
            output: JSON.stringify({
              ok: false,
              status: 'error',
              message: 'The CRM update failed. Do not claim success.'
            })
          }
        });
      }
    });
    sendEvent({ type: 'response.create' });
    live.flushing = false;
    if (live.pendingCalls.length) flushTools();
  }

  async function connectLive(isReconnect) {
    await mintSession();
    await attachPeer();
    live.reconnecting = false;
  }

  async function startLive() {
    if (live.active) return;
    setError('');
    setResult('');
    setLiveMode(true);
    setConn('Connecting to Ask TopAI...', '');
    live.ending = false;
    live.reconnectAttempts = 0;
    live.lastRef = null;
    live.stage = 'microphone';
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw liveError('microphone', 'This browser cannot start a live microphone session. Type your request instead.', { code: 'no_mic' });
      }
      live.stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        video: false
      });
      await connectLive(false);
    } catch (err) {
      logLive('connect-failed', { name: err && err.name, code: err && err.code, message: err && err.message });
      const name = err && err.name;
      let message;
      if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
        message = 'Microphone permission was denied. Allow the microphone or type your request.';
      } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError' || err.code === 'no_mic') {
        message = 'No microphone was found. Plug one in or type your request.';
      } else if (err.code === 'not_configured') {
        message = 'Ask TopAI Live Conversation is not configured yet. You can still type a request.';
      } else {
        message = formatLiveError(err);
      }
      setError(message);
      await endLive(!!live.sessionId);
    }
  }

  async function sendTypedToLive(text) {
    appendTurn('user', text, false);
    rememberTurn('user', text);
    sendEvent({
      type: 'conversation.item.create',
      item: {
        type: 'message',
        role: 'user',
        content: [{ type: 'input_text', text: text }]
      }
    });
    sendEvent({ type: 'response.create' });
    textEl.value = '';
  }

  async function interpret() {
    if (sending) return;
    const text = textEl.value.trim();
    const original = textEl.value;
    setError('');
    setResult('');
    statusEl.classList.remove('clarify');
    renderChoices([]);
    if (!text) { setError('Enter a request first.'); return; }
    if (live.active && live.dc && live.dc.readyState === 'open') {
      lastInputSource = 'text';
      return sendTypedToLive(text);
    }
    const requestId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('req-' + Date.now() + '-' + Math.random());
    setSending(true);
    setConn('Ask TopAI is working...', 'working');
    try {
      const res = await fetch('/api/ask-topai/interpret', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          text,
          context: askContext(),
          session_id: sessionId(),
          source: lastInputSource === 'voice' ? 'voice' : 'text',
          request_id: requestId
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (data.session_id) rememberSession(data.session_id);
      if (res.status === 401) { setError('Please log in to use Ask TopAI.'); return; }
      if (!res.ok && data.status !== 'partial') {
        setError(data.error || data.message || 'Ask TopAI could not process that.');
        textEl.value = original;
        return;
      }
      const status = data.status || '';
      if (status === 'executed') {
        resetPreview();
        setResult(data.message || 'Done.');
        setConn('Start a live conversation or type a request.');
        refreshAffectedUI(data.refresh);
        return;
      }
      if (status === 'partial') {
        resetPreview();
        setResult(data.message || 'Some actions could not be completed.', 'warn');
        refreshAffectedUI(data.refresh);
        return;
      }
      if (status === 'working') {
        setConn(data.message || 'Ask TopAI is working...', 'working');
        textEl.value = original;
        return;
      }
      resetPreview();
      if (status === 'clarification_required' || status === 'needs_clarification') {
        setConn(data.message || 'I need a bit more information.', 'clarify');
        renderChoices(data.choices);
        textEl.value = '';
        textEl.placeholder = 'Type your answer…';
        textEl.focus();
        return;
      }
      if (status === 'informational_response' || status === 'informational') {
        setResult(data.message || 'I understood, and no CRM change is needed.');
        setConn('Start a live conversation or type a request.');
        return;
      }
      if (status === 'unsupported_action' || status === 'unsupported') {
        setResult(data.message || 'Ask TopAI cannot do that yet.', 'warn');
        return;
      }
      if (status === 'error') {
        setError(data.message || 'Ask TopAI could not process that.');
        textEl.value = original;
        return;
      }
      setError(data.message || 'I need more information.');
      textEl.value = original;
    } catch (err) {
      setError(err.message || 'Network error.');
      textEl.value = original;
    } finally {
      setSending(false);
    }
  }

  function resetAll() {
    if (live.active) endLive(true);
    textEl.value = '';
    setConn('Start a live conversation or type a request.');
    resetPreview();
    resetSession();
    lastInputSource = 'text';
    setSending(false);
    setError('');
    setResult('');
    renderChoices([]);
    live.turns = [];
    logEl.innerHTML = '';
    logEl.hidden = true;
  }

  fab.addEventListener('click', () => setOpen(!root.classList.contains('is-open')));
  document.getElementById('ask-topai-close').addEventListener('click', () => setOpen(false));
  document.getElementById('ask-topai-submit').addEventListener('click', interpret);
  textEl.addEventListener('input', () => { lastInputSource = 'text'; });
  document.getElementById('ask-topai-clear').addEventListener('click', resetAll);
  startBtn.addEventListener('click', startLive);
  endBtn.addEventListener('click', () => endLive(true));
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && root.classList.contains('is-open')) setOpen(false);
  });
  window.addEventListener('beforeunload', () => {
    if (live.active) {
      try {
        navigator.sendBeacon && navigator.sendBeacon('/api/ask-topai/live/end', new Blob([JSON.stringify({
          session_id: live.sessionId,
          transcript: live.turns
        })], { type: 'application/json' }));
      } catch (err) {}
      teardownPeer();
      stopMicTracks();
    }
  });
})();
</script>
{% endif %}
