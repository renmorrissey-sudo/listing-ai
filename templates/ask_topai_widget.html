{% if current_user %}
<style>
  .ask-topai-root {
    position: fixed !important;
    right: max(16px, env(safe-area-inset-right, 0px));
    bottom: max(16px, env(safe-area-inset-bottom, 0px));
    left: auto;
    top: auto;
    z-index: 10050;
    font-family: inherit;
    width: auto;
    max-width: calc(100vw - 24px);
    margin: 0;
    padding: 0;
    pointer-events: none;
    transform: none;
    filter: none;
  }
  .ask-topai-fab,
  .ask-topai-panel { pointer-events: auto; }
  .ask-topai-fab {
    display: inline-flex !important;
    align-items: center;
    gap: 8px;
    background: #1a1a2e;
    color: #fff !important;
    border: 0;
    border-radius: 999px;
    padding: 12px 16px !important;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.2;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(15,23,42,0.28);
    width: auto !important;
    max-width: 100%;
    white-space: nowrap;
  }
  .ask-topai-fab-icon { font-size: 16px; line-height: 1; }
  .ask-topai-fab:hover { background: #232344; }
  .ask-topai-fab:focus-visible { outline: 2px solid #4f8ef7; outline-offset: 3px; }
  .ask-topai-panel {
    display: none;
    position: absolute;
    right: 0;
    bottom: 56px;
    width: min(380px, calc(100vw - 24px));
    background: #fff;
    color: #1a1a2e;
    border-radius: 14px;
    box-shadow: 0 16px 40px rgba(15,23,42,0.28);
    border: 1px solid #e5ebf5;
    overflow: hidden;
  }
  .ask-topai-root.is-open .ask-topai-panel { display: block; }
  .ask-topai-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: #1a1a2e; color: #fff; }
  .ask-topai-head strong { font-size: 14px; }
  .ask-topai-close { background: transparent; border: 0; color: #fff; font-size: 18px; cursor: pointer; }
  .ask-topai-body { padding: 12px 14px 14px; }
  .ask-topai-status { font-size: 12px; color: #667; margin: 0 0 8px; }
  .ask-topai-status.listening { color: #b91c1c; font-weight: 700; }
  .ask-topai-status.clarify { color: #1a1a2e; font-weight: 600; }
  .ask-topai-choices { margin: 8px 0 0; padding-left: 18px; font-size: 13px; }
  .ask-topai-plan { margin: 0; padding-left: 22px; }
  .ask-topai-plan > li { margin: 0 0 10px; }
  .ask-topai-plan strong { display: block; font-size: 13px; margin-bottom: 4px; }
  .ask-topai-result.is-warn { color: #9a3412; }
  .ask-topai-transcript {
    width: 100%; min-height: 84px; resize: vertical; border: 1.5px solid #dde3f0; border-radius: 8px;
    padding: 8px; font: inherit; font-size: 14px;
  }
  .ask-topai-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .ask-topai-actions button, .ask-topai-preview button {
    border: 0; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .ask-topai-primary { background: #4f8ef7; color: #fff; }
  .ask-topai-secondary { background: #eef2f7; color: #334; }
  .ask-topai-danger { background: #fef2f2; color: #b91c1c; }
  .ask-topai-preview { margin-top: 12px; background: #f8fafc; border: 1px solid #eef2f7; border-radius: 10px; padding: 10px; }
  .ask-topai-preview h3 { margin: 0 0 8px; font-size: 13px; }
  .ask-topai-preview dl { margin: 0 0 10px; }
  .ask-topai-preview dt { font-size: 11px; color: #667; }
  .ask-topai-preview dd { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
  .ask-topai-result { margin-top: 10px; font-size: 14px; font-weight: 700; color: #15803d; }
  .ask-topai-error { margin-top: 10px; font-size: 13px; color: #b91c1c; }
  @media (max-width: 640px) {
    .ask-topai-root {
      right: max(10px, env(safe-area-inset-right, 0px));
      bottom: max(10px, env(safe-area-inset-bottom, 0px));
    }
    .ask-topai-panel { width: calc(100vw - 20px); }
  }
</style>
<div class="ask-topai-root" id="ask-topai-root">
  <div class="ask-topai-panel" id="ask-topai-panel" role="dialog" aria-labelledby="ask-topai-title" hidden>
    <div class="ask-topai-head">
      <strong id="ask-topai-title">Ask TopAI</strong>
      <button type="button" class="ask-topai-close" id="ask-topai-close" aria-label="Close Ask TopAI">&times;</button>
    </div>
    <div class="ask-topai-body">
      <p class="ask-topai-status" id="ask-topai-status">Type a request or use the microphone.</p>
      <div id="ask-topai-choices" hidden></div>
      <label class="muted" for="ask-topai-text" style="font-size:12px;">Request</label>
      <textarea id="ask-topai-text" class="ask-topai-transcript" placeholder="Create a buyer lead named John Smith at 303-555-1212..."></textarea>
      <div class="ask-topai-actions">
        <button type="button" class="ask-topai-primary" id="ask-topai-mic">Microphone</button>
        <button type="button" class="ask-topai-primary" id="ask-topai-submit">Ask TopAI</button>
        <button type="button" class="ask-topai-secondary" id="ask-topai-clear">Clear</button>
        <button type="button" class="ask-topai-secondary" id="ask-topai-cancel">Cancel</button>
      </div>
      <div class="ask-topai-preview" id="ask-topai-preview" hidden></div>
      <div class="ask-topai-result" id="ask-topai-result" hidden></div>
      <div class="ask-topai-error" id="ask-topai-error" hidden></div>
    </div>
  </div>
  <button type="button" class="ask-topai-fab" id="ask-topai-fab" aria-expanded="false" aria-controls="ask-topai-panel">
    <span class="ask-topai-fab-icon" aria-hidden="true">🎤</span>
    <span class="ask-topai-fab-label">Ask TopAI</span>
  </button>
</div>
<script>
(function initAskTopAI() {
  if (window.__askTopAIInit) return;
  const root = document.getElementById('ask-topai-root');
  if (!root) return;
  window.__askTopAIInit = true;
  if (root.parentNode !== document.body) {
    document.body.appendChild(root);
  }
  const panel = document.getElementById('ask-topai-panel');
  const fab = document.getElementById('ask-topai-fab');
  const statusEl = document.getElementById('ask-topai-status');
  const textEl = document.getElementById('ask-topai-text');
  const previewEl = document.getElementById('ask-topai-preview');
  const resultEl = document.getElementById('ask-topai-result');
  const errorEl = document.getElementById('ask-topai-error');
  const choicesEl = document.getElementById('ask-topai-choices');
  const micBtn = document.getElementById('ask-topai-mic');
  let recognition = null;
  let listening = false;
  let confirmationToken = null;
  let lastInputSource = 'text';

  function sessionId() {
    try {
      let id = sessionStorage.getItem('askTopAISession');
      if (!id) {
        id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('sess-' + Date.now());
        sessionStorage.setItem('askTopAISession', id);
      }
      return id;
    } catch (err) {
      return 'sess-local';
    }
  }

  function rememberSession(id) {
    if (!id) return;
    try { sessionStorage.setItem('askTopAISession', id); } catch (err) {}
  }

  function resetSession() {
    try { sessionStorage.removeItem('askTopAISession'); } catch (err) {}
  }

  function askContext() {
    const page = window.location.pathname || '';
    const match = page.match(/\/crm\/leads\/(\d+)/);
    let leadId = match ? Number(match[1]) : null;
    const smsSelect = document.getElementById('sms-lead-select');
    if (!leadId && smsSelect && smsSelect.value) leadId = Number(smsSelect.value);
    return { page, lead_id: leadId };
  }

  function setOpen(open) {
    root.classList.toggle('is-open', open);
    panel.hidden = !open;
    fab.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) setTimeout(() => textEl.focus(), 30);
  }

  function setError(msg) {
    errorEl.hidden = !msg;
    errorEl.textContent = msg || '';
  }

  function setResult(msg, kind) {
    resultEl.hidden = !msg;
    resultEl.textContent = msg ? ((kind === 'warn' ? '' : '✓ ') + msg) : '';
    resultEl.classList.toggle('is-warn', kind === 'warn');
  }

  function resetPreview() {
    previewEl.hidden = true;
    previewEl.innerHTML = '';
    confirmationToken = null;
  }

  function resetAll() {
    stopMic();
    textEl.value = '';
    statusEl.textContent = 'Type a request or use the microphone.';
    statusEl.classList.remove('listening', 'clarify');
    resetPreview();
    resetSession();
    lastInputSource = 'text';
    setError('');
    setResult('');
    renderChoices([]);
  }

  function actionTitle(command) {
    const titles = {
      create_lead: 'Create Lead',
      add_lead_note: 'Add Note',
      create_task: 'Create Task',
      update_property_criteria: 'Save Property Criteria'
    };
    const fromRows = (command.rows || []).find((row) => row.label === 'Action');
    return titles[command.action] || (fromRows && fromRows.value) || command.action || 'Action';
  }

  function renderPreview(preview, message) {
    if (!preview) {
      resetPreview();
      return;
    }
    const blocks = (preview.commands || []).map((command) => {
      const rows = (command.rows || [])
        .filter((row) => row.label !== 'Action')
        .map((row) => `<dt>${escapeAsk(row.label)}</dt><dd>${escapeAsk(row.value)}</dd>`)
        .join('');
      return `<li><strong>${escapeAsk(actionTitle(command))}</strong><dl>${rows}</dl></li>`;
    }).join('');
    previewEl.innerHTML = `<h3>${escapeAsk(preview.title || 'ASK TOPAI UNDERSTOOD:')}</h3>
      <ol class="ask-topai-plan">${blocks}</ol>
      <div class="ask-topai-actions">
        <button type="button" class="ask-topai-primary" id="ask-topai-confirm">Confirm All</button>
        <button type="button" class="ask-topai-secondary" id="ask-topai-edit">Edit</button>
        <button type="button" class="ask-topai-danger" id="ask-topai-discard">Cancel</button>
      </div>`;
    previewEl.hidden = false;
    if (message) statusEl.textContent = message;
    statusEl.classList.remove('clarify');
    document.getElementById('ask-topai-confirm').onclick = confirmCommand;
    document.getElementById('ask-topai-edit').onclick = () => { resetPreview(); textEl.focus(); };
    document.getElementById('ask-topai-discard').onclick = cancelPending;
  }

  function renderChoices(choices) {
    if (!choicesEl) return;
    if (!choices || !choices.length) {
      choicesEl.hidden = true;
      choicesEl.innerHTML = '';
      return;
    }
    const items = choices.map((choice) => {
      const label = choice.label || choice.name || ('Lead #' + (choice.id || ''));
      const phone = choice.phone_number || choice.phone || '';
      return `<li>${escapeAsk(label)}${phone ? ' — ' + escapeAsk(phone) : ''}</li>`;
    }).join('');
    choicesEl.innerHTML = `<ol class="ask-topai-choices">${items}</ol>`;
    choicesEl.hidden = false;
  }

  function escapeAsk(value) {
    return String(value || '').replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  async function interpret() {
    const text = textEl.value.trim();
    const original = textEl.value;
    setError('');
    setResult('');
    statusEl.classList.remove('clarify');
    renderChoices([]);
    if (!text) { setError('Enter or speak a request first.'); return; }
    try {
      const res = await fetch('/api/ask-topai/interpret', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          text,
          context: askContext(),
          session_id: sessionId(),
          source: lastInputSource === 'voice' ? 'voice' : 'text'
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (data.session_id) rememberSession(data.session_id);
      if (res.status === 401) { setError('Please log in to use Ask TopAI.'); return; }
      if (!res.ok) { setError(data.error || 'Ask TopAI could not process that.'); textEl.value = original; return; }
      const status = data.status || '';
      if (status === 'action_plan' || status === 'needs_confirmation') {
        confirmationToken = data.confirmation_token;
        renderPreview(data.preview, data.message);
        return;
      }
      resetPreview();
      if (status === 'clarification_required' || status === 'needs_clarification') {
        statusEl.textContent = data.message || 'I need a bit more information.';
        statusEl.classList.add('clarify');
        renderChoices(data.choices);
        textEl.value = '';
        textEl.placeholder = 'Type your answer…';
        textEl.focus();
        return;
      }
      if (status === 'informational_response' || status === 'informational') {
        setResult(data.message || 'I understood, and no CRM change is needed.');
        return;
      }
      if (status === 'unsupported_action' || status === 'unsupported') {
        setResult(data.message || 'Ask TopAI cannot do that yet.', 'warn');
        return;
      }
      if (status === 'error') {
        setError(data.message || 'Ask TopAI could not process that.');
        textEl.value = original;
        return;
      }
      setError(data.message || 'I need more information.');
      textEl.value = original;
    } catch (err) {
      setError(err.message || 'Network error.');
      textEl.value = original;
    }
  }

  async function confirmCommand() {
    if (!confirmationToken) return;
    try {
      const res = await fetch('/api/ask-topai/confirm', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ confirmation_token: confirmationToken, context: askContext() }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { setError(data.error || 'Could not complete that action.'); return; }
      if (data.status === 'partial') {
        resetPreview();
        setResult(data.message || 'Some actions could not be completed.', 'warn');
        return;
      }
      resetPreview();
      setResult(data.message || 'Done.');
    } catch (err) {
      setError(err.message || 'Network error.');
    }
  }

  async function cancelPending() {
    if (confirmationToken) {
      try {
        await fetch('/api/ask-topai/cancel', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ confirmation_token: confirmationToken }),
        });
      } catch (err) {}
    }
    resetPreview();
    setOpen(false);
  }

  function stopMic() {
    listening = false;
    if (recognition) {
      try { recognition.stop(); } catch (err) {}
    }
    statusEl.classList.remove('listening');
    micBtn.textContent = 'Microphone';
  }

  function startMic() {
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Rec) {
      setError('Voice capture is not available in this browser. Type your request instead.');
      return;
    }
    recognition = new Rec();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'en-US';
    recognition.onresult = (event) => {
      let finalText = '';
      let interim = '';
      for (let i = 0; i < event.results.length; i++) {
        const chunk = event.results[i][0].transcript;
        if (event.results[i].isFinal) finalText += chunk + ' ';
        else interim += chunk;
      }
      textEl.value = (finalText + interim).trim();
      lastInputSource = 'voice';
    };
    recognition.onerror = () => {
      stopMic();
      setError('Microphone error. You can still type the request.');
    };
    recognition.onend = () => {
      if (listening) {
        try { recognition.start(); } catch (err) { stopMic(); }
      }
    };
    listening = true;
    statusEl.textContent = 'Listening…';
    statusEl.classList.add('listening');
    micBtn.textContent = 'Stop listening';
    recognition.start();
  }

  fab.addEventListener('click', () => setOpen(!root.classList.contains('is-open')));
  document.getElementById('ask-topai-close').addEventListener('click', () => setOpen(false));
  document.getElementById('ask-topai-submit').addEventListener('click', interpret);
  textEl.addEventListener('input', () => { lastInputSource = 'text'; });
  document.getElementById('ask-topai-clear').addEventListener('click', resetAll);
  document.getElementById('ask-topai-cancel').addEventListener('click', cancelPending);
  micBtn.addEventListener('click', () => listening ? stopMic() : startMic());
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && root.classList.contains('is-open')) setOpen(false);
  });
})();
</script>
{% endif %}
