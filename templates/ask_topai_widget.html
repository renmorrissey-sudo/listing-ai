<style>

    position: fixed !important;
    right: max(16px, env(safe-area-inset-right, 0px));

    z-index: 10050;
    font-family: inherit;
    width: auto;

    transform: none;

  .ask-topai-panel { pointer-events: auto; }
  .ask-topai-fab {
    display: inline-flex !important;
    align-items: center;
    gap: 8px;
    background: #1a1a2e;
    color: #fff !important;
    border: 0;
    border-radius: 999px;

    font-weight: 700;

    width: auto !important;

    white-space: nowrap;

  .ask-topai-fab-icon { font-size: 16px; line-height: 1; }

  .ask-topai-fab:focus-visible { outline: 2px solid #4f8ef7; outline-offset: 3px; }

  .ask-topai-primary { background: #1a1a2e; color: #fff; }
  .ask-topai-primary:disabled { opacity: 0.65; cursor: wait; }

<script src="{{ url_for('static', filename='ask_topai/realtime.js') }}?v=20260819b"></script>
<script>
(function initAskTopAI() {
  if (window.__askTopAIInit) return;
  const root = document.getElementById('ask-topai-root');
  if (!root) return;
  window.__askTopAIInit = true;
  if (root.parentNode !== document.body) {
    document.body.appendChild(root);
  }
  const panel = document.getElementById('ask-topai-panel');
  const fab = document.getElementById('ask-topai-fab');
  const titleEl = document.getElementById('ask-topai-title');
  const statusEl = document.getElementById('ask-topai-status');
  const textEl = document.getElementById('ask-topai-text');
  const logEl = document.getElementById('ask-topai-log');
  const previewEl = document.getElementById('ask-topai-preview');
  const resultEl = document.getElementById('ask-topai-result');
  const errorEl = document.getElementById('ask-topai-error');
  const choicesEl = document.getElementById('ask-topai-choices');
  const submitBtn = document.getElementById('ask-topai-submit');
  const startBtn = document.getElementById('ask-topai-live-start');
  const endBtn = document.getElementById('ask-topai-live-end');
  let sending = false;
  let lastInputSource = 'text';
  const live = {
    active: false,
    ending: false,
    reconnecting: false,
    reconnectTimer: null,
    reconnectAttempts: 0,
    sessionId: null,
    realtime: null,
    stream: null,
    minted: null,
    turns: [],
    stage: null,
    lastRef: null,
    cleanupPromise: null
  };
  window.__askTopAILive = live;

  function sessionId() {
    try {
      let id = sessionStorage.getItem('askTopAISession');
      if (!id) {
        id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('sess-' + Date.now());
        sessionStorage.setItem('askTopAISession', id);
      }
      return id;
    } catch (err) {
      return 'sess-local';
    }
  }

  function rememberSession(id) {
    if (!id) return;
    try { sessionStorage.setItem('askTopAISession', id); } catch (err) {}
  }

  function resetSession() {
    try { sessionStorage.removeItem('askTopAISession'); } catch (err) {}
  }

  function askContext() {
    const page = window.location.pathname || '';
    const match = page.match(/\/crm\/leads\/(\d+)/);
    let leadId = match ? Number(match[1]) : null;
    const smsSelect = document.getElementById('sms-lead-select');
    if (!leadId && smsSelect && smsSelect.value) leadId = Number(smsSelect.value);
    let leadName = null;
    const heading = document.querySelector('h1, .lead-name, [data-lead-name]');
    if (leadId && heading) leadName = (heading.getAttribute('data-lead-name') || heading.textContent || '').trim().slice(0, 120);
    return { page, lead_id: leadId, lead_name: leadName };
  }

  function applyPanelOpen(open) {
    root.classList.toggle('is-open', !!open);
    panel.hidden = !open;
    fab.hidden = false;
    fab.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) setTimeout(() => textEl.focus(), 30);
  }

  function resetLiveConversationState() {
    live.turns = [];
    live.assistantEl = null;
    live.userEl = null;
    logEl.innerHTML = '';
    logEl.hidden = true;
  }

  function hasLiveResources() {
    return !!(live.active || live.realtime || live.stream || live.reconnectTimer);
  }

  function setOpen(open) {
    if (open) {
      applyPanelOpen(true);
      return;
    }
    if (hasLiveResources()) {
      cleanupLiveSession({ notify: true, closePanel: true });
      return;
    }
    applyPanelOpen(false);
  }

  function setError(msg) {
    errorEl.hidden = !msg;
    errorEl.textContent = msg || '';
  }

  function setResult(msg, kind) {
    resultEl.hidden = !msg;
    resultEl.textContent = msg ? ((kind === 'warn' ? '' : '✓ ') + msg) : '';
    resultEl.classList.toggle('is-warn', kind === 'warn');
  }

  function resetPreview() {
    previewEl.hidden = true;
    previewEl.innerHTML = '';
  }

  function setSending(on) {
    sending = !!on;
    if (submitBtn) {
      submitBtn.disabled = sending;
      submitBtn.textContent = sending ? 'Working…' : 'Send';
    }
  }

  function setConn(label, kind) {
    statusEl.textContent = label;
    statusEl.classList.remove('listening', 'speaking', 'working', 'reconnecting', 'clarify');
    if (kind) statusEl.classList.add(kind);
  }

  function liveError(stage, message, extra) {
    extra = extra || {};
    const err = new Error(message || 'Could not establish the realtime audio connection.');
    err.stage = stage;
    err.code = extra.code;
    err.status = extra.status;
    err.ref = extra.ref || live.lastRef;
    err.userMessage = extra.userMessage || message;
    return err;
  }

  function formatLiveError(err) {
    let message = (err && (err.userMessage || err.message)) || 'Could not establish the realtime audio connection.';
    const ref = err && err.ref;
    if (ref) message += ' (ref ' + ref + ')';
    return message;
  }

  function logLive(reason, extra) {
    const transport = live.realtime && live.realtime.transport;
    const payload = {
      stage: live.stage,
      ref: live.lastRef,
      status: transport && transport.status,
      connection: transport && transport.connectionState && transport.connectionState.status
    };
    if (extra) Object.keys(extra).forEach((key) => { payload[key] = extra[key]; });
    console.info('Ask TopAI live', reason, payload);
  }

  function setLiveMode(on) {
    live.active = !!on;
    root.classList.toggle('is-live', live.active);
    titleEl.textContent = live.active ? 'Ask TopAI — Live' : 'Ask TopAI';
    logEl.hidden = !live.active && live.turns.length === 0;
    if (startBtn) startBtn.disabled = !!on;
    if (endBtn) endBtn.disabled = !on;
  }

  function escapeAsk(value) {
    return String(value || '').replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  function renderChoices(choices) {
    if (!choicesEl) return;
    if (!choices || !choices.length) {
      choicesEl.hidden = true;
      choicesEl.innerHTML = '';
      return;
    }
    const items = choices.map((choice) => {
      const label = choice.label || choice.name || ('Lead #' + (choice.id || ''));
      const phone = choice.phone_number || choice.phone || '';
      return `<li>${escapeAsk(label)}${phone ? ' — ' + escapeAsk(phone) : ''}</li>`;
    }).join('');
    choicesEl.innerHTML = `<ol class="ask-topai-choices">${items}</ol>`;
    choicesEl.hidden = false;
  }

  function appendTurn(role, text, streaming) {
    logEl.hidden = false;
    const label = role === 'user' ? 'You' : 'Ask TopAI';
    if (streaming && role === 'assistant' && live.assistantEl) {
      live.assistantEl.querySelector('p').textContent = text;
      logEl.scrollTop = logEl.scrollHeight;
      return;
    }
    const wrap = document.createElement('div');
    wrap.className = 'ask-topai-turn ' + (role === 'user' ? 'you' : 'assistant');
    wrap.innerHTML = `<strong>${label}</strong><p></p>`;
    wrap.querySelector('p').textContent = text || '';
    logEl.appendChild(wrap);
    logEl.scrollTop = logEl.scrollHeight;
    if (role === 'assistant' && streaming) live.assistantEl = wrap;
    if (role === 'user') live.userEl = wrap;
    return wrap;
  }

  function rememberTurn(role, text) {
    const cleaned = String(text || '').trim();
    if (!cleaned) return;
    const last = live.turns[live.turns.length - 1];
    if (last && last.role === role) last.text = cleaned;
    else live.turns.push({ role, text: cleaned });
  }

  function lastUserText() {
    for (let i = live.turns.length - 1; i >= 0; i--) {
      if (live.turns[i].role === 'user') return live.turns[i].text;
    }
    return textEl.value.trim();
  }

  function refreshAffectedUI(refresh) {
    if (!refresh) return;
    const path = window.location.pathname || '';
    const leadMatch = path.match(/\/crm\/leads\/(\d+)/);
    const leadIds = refresh.lead_ids || [];
    if (refresh.tasks && path.indexOf('/crm/tasks') === 0) {
      window.location.reload();
      return;
    }
    if (refresh.leads && path.indexOf('/crm/leads') === 0 && !leadMatch) {
      window.location.reload();
      return;
    }
    if (leadMatch && leadIds.map(String).indexOf(leadMatch[1]) !== -1) {
      window.location.reload();
    }
  }

  function stopPlaybackAudio(session) {
    const seen = [];
    function hush(el) {
      if (!el || seen.indexOf(el) !== -1) return;
      seen.push(el);
      try { el.pause(); } catch (err) {}
      try { el.muted = true; } catch (err) {}
      try {
        if (el.srcObject && el.srcObject.getTracks) {
          el.srcObject.getTracks().forEach((track) => { try { track.stop(); } catch (e) {} });
        }
        el.srcObject = null;
      } catch (err) {}
      try { el.removeAttribute('src'); } catch (err) {}
      try { if (el.load) el.load(); } catch (err) {}
    }
    try {
      const transport = session && session.transport;
      if (!transport) return;
      hush(transport.audioElement);
      hush(transport.audioEl);
      hush(transport._audioElement);
      const state = transport.connectionState || {};
      hush(state.audioElement);
    } catch (err) {}
  }

  function closeDataChannels(pc, transport) {
    try {
      if (transport && transport.dataChannel && transport.dataChannel.close) {
        transport.dataChannel.close();
      }
    } catch (err) {}
    try {
      const state = transport && transport.connectionState;
      if (state && state.dataChannel && state.dataChannel.close) state.dataChannel.close();
    } catch (err) {}
    try {
      if (pc && pc.getTransceivers) {
        pc.getTransceivers().forEach((t) => {
          try { if (t.stop) t.stop(); } catch (err) {}
        });
      }
    } catch (err) {}
  }

  function closePeerConnection(pc) {
    if (!pc) return;
    try {
      pc.getSenders().forEach((sender) => {
        try { if (sender.track) sender.track.stop(); } catch (err) {}
      });
    } catch (err) {}
    try {
      pc.getReceivers().forEach((receiver) => {
        try { if (receiver.track) receiver.track.stop(); } catch (err) {}
      });
    } catch (err) {}
    try { pc.close(); } catch (err) {}
  }

  function teardownPeer() {
    const session = live.realtime;
    live.realtime = null;
    live.minted = null;
    if (!session) return;
    let transport = null;
    let pc = null;
    try { transport = session.transport; } catch (err) {}
    try {
      pc = (transport && transport.connectionState && transport.connectionState.peerConnection)
        || (transport && transport.peerConnection)
        || null;
    } catch (err) {}
    stopPlaybackAudio(session);
    closeDataChannels(pc, transport);
    try { if (session.close) session.close(); } catch (err) {}
    closePeerConnection(pc);
  }

  function stopMicTracks() {
    if (!live.stream) return;
    live.stream.getTracks().forEach((track) => { try { track.stop(); } catch (err) {} });
    live.stream = null;
  }

  function cleanupLiveSession(opts) {
    opts = opts || {};
    const notify = opts.notify !== false;
    const closePanel = !!opts.closePanel;
    const useBeacon = !!opts.beacon;

    if (live.cleanupPromise && hasLiveResources()) {
      return live.cleanupPromise.then(() => {
        if (closePanel) {
          resetLiveConversationState();
          applyPanelOpen(false);
        }
      });
    }

    live.ending = true;
    live.active = false;
    if (live.reconnectTimer) {
      clearTimeout(live.reconnectTimer);
      live.reconnectTimer = null;
    }
    const sid = live.sessionId;
    const turns = live.turns.slice();
    teardownPeer();
    stopMicTracks();
    setLiveMode(false);
    setConn('Start a live conversation or type a request.');
    live.sessionId = null;
    live.reconnecting = false;
    live.reconnectAttempts = 0;
    live.stage = null;
    live.lastRef = null;

    function finishPanel() {
      if (closePanel) {
        resetLiveConversationState();
        applyPanelOpen(false);
      }
    }

    if (!notify || !sid) {
      live.ending = false;
      finishPanel();
      return Promise.resolve();
    }
    if (useBeacon) {
      try {
        navigator.sendBeacon && navigator.sendBeacon('/api/ask-topai/live/end', new Blob([JSON.stringify({
          session_id: sid,
          transcript: turns
        })], { type: 'application/json' }));
      } catch (err) {}
      live.ending = false;
      finishPanel();
      return Promise.resolve();
    }
    live.cleanupPromise = fetch('/api/ask-topai/live/end', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sid, transcript: turns })
    }).catch(() => {}).then(() => {
      live.ending = false;
      live.cleanupPromise = null;
    });
    finishPanel();
    return live.cleanupPromise;
  }

  async function endLive(notify) {
    return cleanupLiveSession({ notify: !!notify, closePanel: false });
  }

  function messageForSessionFailure(res, data) {
    if (res.type === 'opaqueredirect' || (res.status >= 300 && res.status < 400)) {
      return liveError('redirect', 'Network connection to Ask TopAI was interrupted.', { status: res.status, code: 'redirect', ref: data.ref });
    }
    if (res.status === 401) {
      return liveError('railway_auth', 'Please log in to continue.', { status: 401, code: 'login', ref: data.ref });
    }
    const code = data.code || '';
    const stage = data.stage || 'backend_session';
    if (code === 'not_configured' || stage === 'missing_key') {
      return liveError(stage, 'Ask TopAI is not configured for live conversation.', { status: res.status, code: code, ref: data.ref });
    }
    if (code === 'openai_401' || code === 'openai_403' || stage === 'openai_auth') {
      return liveError(stage, 'OpenAI authentication failed.', { status: res.status, code: code, ref: data.ref });
    }
    if (code === 'openai_429' || stage === 'openai_quota') {
      return liveError(stage, 'OpenAI API quota is unavailable.', { status: res.status, code: code, ref: data.ref });
    }
    if (code === 'network' || stage === 'openai_network') {
      return liveError(stage, 'Network connection to Ask TopAI was interrupted.', { status: res.status, code: code, ref: data.ref });
    }
    return liveError(stage, data.error || 'Could not establish the realtime audio connection.', {
      status: res.status,
      code: code,
      ref: data.ref,
      userMessage: data.error
    });
  }

  async function mintSession() {
    live.stage = 'backend_session';
    let res;
    try {
      res = await fetch('/api/ask-topai/live/session', {
        method: 'POST',
        credentials: 'same-origin',
        redirect: 'manual',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: live.sessionId,
          context: askContext()
        })
      });
    } catch (err) {
      throw liveError('backend_session', 'Network connection to Ask TopAI was interrupted.', { code: 'network' });
    }
    const data = await res.json().catch(() => ({}));
    live.lastRef = data.ref || live.lastRef;
    if (!res.ok || !data.ok) throw messageForSessionFailure(res, data);
    const secret = data.client_secret && data.client_secret.value;
    if (!secret || String(secret).indexOf('ek_') !== 0) {
      throw liveError('client_secret', 'Could not establish the realtime audio connection.', {
        code: 'malformed',
        ref: data.ref
      });
    }
    if (data.session_id) {
      live.sessionId = data.session_id;
      rememberSession(data.session_id);
    }
    live.minted = data;
    return data;
  }

  async function executeCrmTool(name, args, details) {
    setConn('Working...', 'working');
    const callId = (details && (details.toolCallId || details.callId)) ||
      (details && details.toolCall && (details.toolCall.callId || details.toolCall.call_id)) ||
      ('call-' + Date.now());
    try {
      const res = await fetch('/api/ask-topai/live/tools', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: live.sessionId,
          transcript: lastUserText(),
          context: askContext(),
          calls: [{ name: name, call_id: callId, arguments: args || {} }]
        })
      });
      const data = await res.json().catch(() => ({}));
      refreshAffectedUI(data.refresh);
      const output = (data.results && data.results[0] && data.results[0].output) || {
        ok: false,
        status: 'error',
        message: 'The CRM update failed. Do not claim success.'
      };
      if (output.ok) setConn('Listening', 'listening');
      else if (output.message) setError(String(output.message).slice(0, 220));
      return JSON.stringify(output);
    } catch (err) {
      setConn('Listening', 'listening');
      return JSON.stringify({
        ok: false,
        status: 'error',
        message: 'The CRM update failed. Do not claim success.'
      });
    }
  }

  function renderHistoryTurns(turns) {
    live.turns = turns || [];
    logEl.innerHTML = '';
    live.turns.forEach((turn) => appendTurn(turn.role, turn.text, false));
    logEl.hidden = live.turns.length === 0 && !live.active;
  }

  function scheduleReconnect() {
    if (live.ending || live.reconnecting || !live.active) return;
    if (live.reconnectAttempts >= 3) {
      setError('The live connection dropped. You can start again or type a request.');
      endLive(true);
      return;
    }
    live.reconnecting = true;
    live.reconnectAttempts += 1;
    setConn('Reconnecting...', 'reconnecting');
    const wait = Math.min(4000, 800 * live.reconnectAttempts);
    live.reconnectTimer = setTimeout(() => {
      connectLive(true).catch(() => {
        live.reconnecting = false;
        scheduleReconnect();
      });
    }, wait);
  }

  async function connectLive() {
    if (!window.AskTopAIRealtime || !window.AskTopAIRealtime.connect) {
      throw liveError('realtime_connect', 'Could not establish the realtime audio connection.', { code: 'sdk_missing' });
    }
    const minted = await mintSession();
    live.stage = 'realtime_connect';
    teardownPeer();
    live.realtime = await window.AskTopAIRealtime.connect({
      apiKey: minted.client_secret.value,
      model: minted.model || 'gpt-realtime-2.1',
      voice: minted.voice || 'marin',
      instructions: minted.instructions,
      toolSpecs: minted.tools || [],
      mediaStream: live.stream,
      executeTool: executeCrmTool,
      onHistory: function (turns) { renderHistoryTurns(turns); },
      onEvent: function (name, payload) {
        logLive(name, payload && typeof payload === 'object' ? payload : { value: payload });
        if (name === 'agent_start') setConn('TopAI is speaking', 'speaking');
        if (name === 'agent_end' || name === 'audio_interrupted') setConn('Listening', 'listening');
        if (name === 'connection_change' && (payload === 'disconnected' || payload === 'failed') && live.active && !live.ending) {
          scheduleReconnect();
        }
      },
      onError: function (error) {
        logLive('session-error', { message: error && (error.message || error.error) });
      }
    });
    live.stage = 'connected';
    live.reconnecting = false;
    live.reconnectAttempts = 0;
    setConn('Listening', 'listening');
    logLive('connected');
  }

  async function startLive() {
    if (live.active) return;
    if (live.realtime || live.stream) {
      await cleanupLiveSession({ notify: false, closePanel: false });
    }
    setError('');
    setResult('');
    setLiveMode(true);
    setConn('Connecting to Ask TopAI...', '');
    live.ending = false;
    live.reconnectAttempts = 0;
    live.lastRef = null;
    live.stage = 'microphone';
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw liveError('microphone', 'Microphone access is blocked.', { code: 'no_mic' });
      }
      live.stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        video: false
      });
      await connectLive(false);
    } catch (err) {
      logLive('connect-failed', { name: err && err.name, code: err && err.code, message: err && err.message, status: err && err.status });
      const name = err && err.name;
      let message;
      if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || err.code === 'no_mic') {
        message = 'Microphone access is blocked.';
      } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
        message = 'Microphone access is blocked.';
      } else if (err.code === 'not_configured') {
        message = 'Ask TopAI is not configured for live conversation.';
      } else {
        message = formatLiveError(err);
      }
      setError(message);
      await endLive(!!live.sessionId);
    }
  }


  async function sendTypedToLive(text) {
    appendTurn('user', text, false);
    rememberTurn('user', text);
    if (live.realtime && typeof live.realtime.sendMessage === 'function') {
      live.realtime.sendMessage(text);
    }
    textEl.value = '';
  }

  async function interpret() {
    if (sending) return;
    const text = textEl.value.trim();
    const original = textEl.value;
    setError('');
    setResult('');
    statusEl.classList.remove('clarify');
    renderChoices([]);
    if (!text) { setError('Enter a request first.'); return; }
    if (live.active && live.realtime) {
      lastInputSource = 'text';
      return sendTypedToLive(text);
    }
    const requestId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('req-' + Date.now() + '-' + Math.random());
    setSending(true);
    setConn('Ask TopAI is working...', 'working');
    try {
      const res = await fetch('/api/ask-topai/interpret', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          text,
          context: askContext(),
          session_id: sessionId(),
          source: lastInputSource === 'voice' ? 'voice' : 'text',
          request_id: requestId
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (data.session_id) rememberSession(data.session_id);
      if (res.status === 401) { setError('Please log in to use Ask TopAI.'); return; }
      if (!res.ok && data.status !== 'partial') {
        setError(data.error || data.message || 'Ask TopAI could not process that.');
        textEl.value = original;
        return;
      }
      const status = data.status || '';
      if (status === 'executed') {
        resetPreview();
        setResult(data.message || 'Done.');
        setConn('Start a live conversation or type a request.');
        refreshAffectedUI(data.refresh);
        return;
      }
      if (status === 'partial') {
        resetPreview();
        setResult(data.message || 'Some actions could not be completed.', 'warn');
        refreshAffectedUI(data.refresh);
        return;
      }
      if (status === 'working') {
        setConn(data.message || 'Ask TopAI is working...', 'working');
        textEl.value = original;
        return;
      }
      resetPreview();
      if (status === 'clarification_required' || status === 'needs_clarification') {
        setConn(data.message || 'I need a bit more information.', 'clarify');
        renderChoices(data.choices);
        textEl.value = '';
        textEl.placeholder = 'Type your answer…';
        textEl.focus();
        return;
      }
      if (status === 'informational_response' || status === 'informational') {
        setResult(data.message || 'I understood, and no CRM change is needed.');
        setConn('Start a live conversation or type a request.');
        return;
      }
      if (status === 'unsupported_action' || status === 'unsupported') {
        setResult(data.message || 'Ask TopAI cannot do that yet.', 'warn');
        return;
      }
      if (status === 'error') {
        setError(data.message || 'Ask TopAI could not process that.');
        textEl.value = original;
        return;
      }
      setError(data.message || 'I need more information.');
      textEl.value = original;
    } catch (err) {
      setError(err.message || 'Network error.');
      textEl.value = original;
    } finally {
      setSending(false);
    }
  }

  function resetAll() {
    if (hasLiveResources()) endLive(true);
    textEl.value = '';
    setConn('Start a live conversation or type a request.');
    resetPreview();
    resetSession();
    lastInputSource = 'text';
    setSending(false);
    setError('');
    setResult('');
    renderChoices([]);
    live.turns = [];
    logEl.innerHTML = '';
    logEl.hidden = true;
  }

  fab.addEventListener('click', () => setOpen(!root.classList.contains('is-open')));
  document.getElementById('ask-topai-close').addEventListener('click', () => setOpen(false));
  document.getElementById('ask-topai-submit').addEventListener('click', interpret);
  textEl.addEventListener('input', () => { lastInputSource = 'text'; });
  document.getElementById('ask-topai-clear').addEventListener('click', resetAll);
  startBtn.addEventListener('click', startLive);
  endBtn.addEventListener('click', () => cleanupLiveSession({ notify: true, closePanel: true }));
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && root.classList.contains('is-open')) setOpen(false);
  });
  window.addEventListener('beforeunload', () => {
    if (hasLiveResources()) {
      cleanupLiveSession({ notify: true, beacon: true, closePanel: false });
    }
  });
})();
</script>
{% endif %}
