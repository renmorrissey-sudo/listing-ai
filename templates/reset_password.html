<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create or reset password — TopAI Real Estate Tools</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; color: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: white; border-radius: 12px; padding: 32px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); width: 100%; max-width: 420px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p.sub { color: #667; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
    label { display: block; font-size: 12px; font-weight: 600; color: #556; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
    input { width: 100%; padding: 10px 12px; border: 1.5px solid #e0e4ed; border-radius: 7px; font-size: 14px; margin-bottom: 14px; }
    .btn { width: 100%; padding: 12px; background: #4f8ef7; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .error { background: #fff5f5; border: 1.5px solid #fca5a5; color: #dc2626; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
    .footer { margin-top: 20px; font-size: 13px; color: #667; text-align: center; }
    a { color: #4f8ef7; text-decoration: none; }
    .brand { font-size: 13px; color: #667; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">TopAI Real Estate Tools · Operated by Sky Blue Holdings LLC</div>
    <h1>Create or reset password</h1>
    <p class="sub">Choose a new password for your TopAI Real Estate Tools account.</p>
    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
    {% if not invalid %}
    <form method="post" action="/reset-password">
      <input type="hidden" name="token" value="{{ token }}" />
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" />
      <label for="confirm_password">Confirm password</label>
      <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required minlength="8" />
      <button class="btn" type="submit">Save password</button>
    </form>
    {% endif %}
    <p class="footer"><a href="/login">Back to sign in</a> · <a href="/forgot-password">Request a new link</a></p>
  </div>
</body>
</html>
