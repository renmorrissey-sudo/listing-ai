<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { overflow-x: hidden; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; color: #1a1a2e; line-height: 1.55; overflow-x: hidden; }
  header { background: #1a1a2e; color: white; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .logo { font-size: 20px; font-weight: 700; }
  .logo span { color: #4f8ef7; }
  .tagline { font-size: 12px; color: #8899aa; margin-top: 2px; }
  .subscriber-info { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .subscriber-email { font-size: 12px; color: #22c55e; font-weight: 600; }
  .billing-link { border: 1.5px solid #4f8ef7; border-radius: 6px; padding: 6px 12px; font-size: 12px; color: #dce8ff; text-decoration: none; }
  .logout-btn { background: none; border: 1.5px solid #445; border-radius: 6px; padding: 6px 12px; font-size: 12px; color: #aab; cursor: pointer; }
  .tool-nav-bar { background: #232344; padding: 0 32px; }
  .tool-nav-toggle {
    display: none; align-items: center; gap: 8px; width: 100%;
    background: transparent; border: none; color: #ccd; font-size: 13px; font-weight: 700;
    padding: 10px 0; cursor: pointer;
  }
  .tool-nav-toggle:focus-visible { outline: 2px solid #4f8ef7; outline-offset: 2px; }
  .tool-nav-toggle-icon {
    width: 18px; height: 2px; background: #ccd; position: relative; display: inline-block;
  }
  .tool-nav-toggle-icon::before,
  .tool-nav-toggle-icon::after {
    content: ''; position: absolute; left: 0; width: 18px; height: 2px; background: #ccd;
  }
  .tool-nav-toggle-icon::before { top: -6px; }
  .tool-nav-toggle-icon::after { top: 6px; }
  .tool-nav {
    display: flex; gap: 4px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    scrollbar-width: thin; max-width: 100%;
  }
  .tool-nav a {
    padding: 12px 16px; font-size: 13px; font-weight: 600; color: #8899bb;
    text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap; flex: 0 0 auto;
  }
  .tool-nav a:hover { color: #ccd; }
  .tool-nav a:focus-visible { outline: 2px solid #4f8ef7; outline-offset: -2px; }
  .tool-nav a.active { color: #4f8ef7; border-bottom-color: #4f8ef7; }
  main { max-width: 1100px; margin: 28px auto 40px; padding: 0 20px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  h2 { font-size: 18px; margin: 0 0 12px; }
  h3 { font-size: 15px; margin: 16px 0 8px; }
  .muted { color: #667; }
  .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 5px rgba(0,0,0,0.08); margin-bottom: 16px; }
  .pill { display: inline-block; background: #eef5ff; color: #1d4ed8; border-radius: 999px; padding: 2px 8px; font-size: 11px; font-weight: 700; }
  .pill.warn { background: #fff7ed; color: #c2410c; }
  .pill.danger { background: #fef2f2; color: #b91c1c; }
  .empty { color: #889; font-size: 13px; padding: 8px 0; }
  .cta, .btn { display: inline-block; background: #4f8ef7; color: white; border: none; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 700; text-decoration: none; cursor: pointer; }
  .btn.secondary { background: #eef2f7; color: #334; }
  .btn.danger { background: #dc2626; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 18px; }
  .filter-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    background: #eef5ff; border: 1px solid #c7dbff; border-radius: 10px; padding: 10px 14px; margin: 12px 0 16px;
    font-size: 13px;
  }
  .filter-banner .filter-label { font-weight: 700; color: #1d4ed8; }
  .filter-banner .filter-count { color: #445; }
  .filter-banner a { color: #1d4ed8; font-weight: 700; text-decoration: none; }
  .filter-banner a:hover { text-decoration: underline; }
  select, input, textarea { border: 1.5px solid #dde3f0; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #eef2f7; vertical-align: top; }
  th { color: #667; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }
  .timeline { list-style: none; padding: 0; margin: 0; }
  .timeline li { padding: 10px 0; border-bottom: 1px solid #eef2f7; font-size: 13px; }
  .grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  .status-hero { font-size: 22px; font-weight: 800; margin: 4px 0 10px; }
  .quick-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .flash { display: none; background: #ecfdf5; color: #065f46; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
  .flash.err { background: #fef2f2; color: #991b1b; }
  .subscriber-footer {
    max-width: 1100px; margin: 0 auto 36px; padding: 0 20px; color: #667; font-size: 14px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  }
  .subscriber-footer a { color: #4f8ef7; text-decoration: none; }
  .subscriber-footer a:hover { text-decoration: underline; }
  .footer-utility { display: flex; flex-wrap: wrap; gap: 12px 16px; font-size: 13px; }
  @media (max-width: 900px) {
    .grid-2 { grid-template-columns: 1fr; }
    header, .tool-nav-bar { padding-left: 16px; padding-right: 16px; }
    .tool-nav-toggle { display: flex; }
    .tool-nav {
      display: none; flex-direction: column; overflow-x: visible; padding-bottom: 8px;
    }
    .tool-nav-bar.is-open .tool-nav { display: flex; }
    .tool-nav a { border-bottom: none; border-left: 3px solid transparent; padding: 10px 8px; }
    .tool-nav a.active { border-left-color: #4f8ef7; }
    .subscriber-footer { flex-direction: column; align-items: flex-start; }
  }
</style>
