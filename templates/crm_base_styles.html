<style>

  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 18px; }

  .timeline { list-style: none; padding: 0; margin: 0; }

  .quick-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }

  .page-header {

    margin-bottom: 6px;

  .page-header-titles h1 { margin-bottom: 2px; }
  .page-header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .leads-toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 16px 0 14px; }
  .search-input-wrap { position: relative; flex: 1 1 260px; min-width: 200px; }

    position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #99a; font-size: 13px; pointer-events: none;
  }
  .quick-status-select { min-width: 150px; }

  .filters-popover-wrap { position: relative; }

    display: none; position: absolute; right: 0; top: calc(100% + 8px); z-index: 60;

    padding: 16px; width: 320px; max-width: calc(100vw - 40px);

  .filters-popover.open { display: block; }
  .filters-popover .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .filters-popover .field label { font-size: 12px; font-weight: 700; color: #445; }
  .filters-popover select, .filters-popover input { width: 100%; }
  .filters-popover-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

  .lead-list { display: flex; flex-direction: column; }

  .empty-state-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  .drawer-backdrop {

  }
  .drawer-backdrop.open { display: flex; }
  .drawer-panel {

    display: flex; flex-direction: column; gap: 14px;
  }
  .drawer-header { display: flex; align-items: center; justify-content: space-between; }

  .form-field { display: flex; flex-direction: column; gap: 4px; }

  .drawer-footer {
    display: flex; gap: 8px; justify-content: flex-end; margin-top: auto; padding-top: 14px;
    border-top: 1px solid #eef2f7;
  }

  .source-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .source-card { border: 1px solid #eef2f7; border-radius: 10px; padding: 14px; background: #fff; }
  .source-card.disabled { opacity: 0.6; }
  .source-card-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .source-card-sub { color: #667; font-size: 12px; margin-bottom: 10px; }

  @media (max-width: 640px) {

</style>
