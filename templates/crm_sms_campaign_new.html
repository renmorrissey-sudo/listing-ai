<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New SMS campaign - {{ product_name }}</title>
  <meta name="robots" content="noindex" />
  {% include 'crm_base_styles.html' %}
</head>
<body>
  {% set page_tagline = 'New campaign' %}
  {% include 'subscriber_header.html' %}
  {% include 'subscriber_tool_nav.html' %}
  <main>
    <p class="muted"><a href="/crm/sms-campaigns">← Campaigns</a></p>
    <h1>Create campaign</h1>
    <div class="card">
      <form method="post">
        <label>Title <input name="title" required placeholder="Open house follow-up" /></label>
        <label>Purpose <input name="campaign_purpose" value="real_estate_follow_up" /></label>
        <button class="btn" type="submit">Continue</button>
      </form>
    </div>
  </main>
  {% include 'subscriber_footer.html' %}
  {% include 'subscriber_nav_script.html' %}
</body>
</html>
