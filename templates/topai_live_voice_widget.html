{% if live_voice_config.enabled %}
<style>
  .topai-live-button {
    position: fixed; right: 18px; bottom: 18px; z-index: 1201;
    min-width: 104px; min-height: 36px; padding: 8px 12px; border: 1px solid #60a5fa;
    border-radius: 7px; background: #2563eb; color: white; font: inherit; font-size: 13px;
    font-weight: 750; cursor: pointer; white-space: nowrap;
    box-shadow: 0 12px 32px rgba(15, 23, 42, .22);
  }
  .topai-live-button:hover { background: #1d4ed8; }
  .topai-live-button:disabled { opacity: .65; cursor: wait; }
  .topai-live-button[data-call-state="active"] { background: #b91c1c; border-color: #ef4444; }
  .topai-live-panel {
    position: fixed; right: 18px; bottom: 66px; z-index: 1200; width: min(380px, calc(100vw - 28px));
    background: #fff; color: #1a1a2e; border: 1px solid #dbe4f0; border-radius: 8px;
    box-shadow: 0 18px 48px rgba(15, 23, 42, .24); overflow: hidden;
  }
  .topai-live-panel[hidden] { display: none; }
  .topai-live-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: #1a1a2e; color: white; }
  .topai-live-state { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; font-weight: 750; }
  .topai-live-dot { width: 9px; height: 9px; border-radius: 50%; background: #60a5fa; flex: 0 0 auto; }
  .topai-live-panel[data-state="listening"] .topai-live-dot { background: #22c55e; box-shadow: 0 0 0 4px rgba(34, 197, 94, .17); }
  .topai-live-panel[data-state="speaking"] .topai-live-dot { background: #60a5fa; box-shadow: 0 0 0 4px rgba(96, 165, 250, .18); }
  .topai-live-end { border: 1px solid #69718c; border-radius: 6px; background: transparent; color: white; padding: 6px 9px; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
  .topai-live-transcript { min-height: 92px; max-height: 210px; overflow-y: auto; padding: 13px 14px; font-size: 14px; line-height: 1.5; }
  .topai-live-line { margin: 0 0 9px; }
  .topai-live-line strong { color: #1d4ed8; }
  .topai-live-error { color: #b91c1c; }
  @media (max-width: 640px) {
    .topai-live-panel { right: 14px; bottom: 66px; }
    .topai-live-button { right: 14px; bottom: 14px; min-width: 96px; }
  }
</style>
<button type="button" class="topai-live-button" id="topai-live-button" disabled>Ask TopAI</button>
<section class="topai-live-panel" id="topai-live-panel" data-state="connecting" aria-live="polite" hidden>
  <div class="topai-live-panel-head">
    <div class="topai-live-state"><span class="topai-live-dot" aria-hidden="true"></span><span id="topai-live-status">Connecting...</span></div>
    <button type="button" class="topai-live-end" id="topai-live-end">End</button>
  </div>
  <div class="topai-live-transcript" id="topai-live-transcript"><p class="topai-live-line">Starting live conversation...</p></div>
</section>
<script type="application/json" id="topai-live-config">{{ live_voice_config | tojson }}</script>
<script type="module" src="{{ url_for('static', filename='topai_live_voice.js') }}"></script>
{% endif %}
